media:
  input: src/assets
  output: /assets
content:
  - name: posts
    label: Posts
    type: collection
    path: src/posts
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: date
        label: Date
        type: date
      - name: image
        label: Image
        type: image
      - name: alt
        label: Image alt text
        type: string
      - name: credit
        label: Image credit
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text